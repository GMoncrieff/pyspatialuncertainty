[project]
name = "pyspatialuncertainty"
version = "0.1.0"
description = "Uncertainty of spatial averages and totals of maps (Wadoux & Heuvelink, 2023): Monte Carlo integration of point-support prediction error covariances over blocks, for continuous and categorical maps."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "GMoncrieff" }]
requires-python = ">=3.12"
keywords = [
    "geostatistics",
    "uncertainty",
    "spatial aggregation",
    "block kriging",
    "Monte Carlo integration",
    "variogram",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: GIS",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=2.1",
    "scipy>=1.14",
    "xarray>=2025.1",
    "rioxarray>=0.18",
    "rasterio>=1.4",
    "shapely>=2.0",
    # Pinned to the latest release on PyPI at the time of writing (2026-10-06).
    "polars==2.0.0",
]

[project.optional-dependencies]
# Needed only by the synthetic full-pipeline scenario and the R-example port.
ml = ["scikit-learn>=1.5", "quantile-forest>=1.4"]

[project.urls]
Repository = "https://github.com/GMoncrieff/pyspatialuncertainty"
Paper = "https://doi.org/10.1111/2041-210X.14106"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "hypothesis>=6.120",
    "ruff>=0.9",
    "mypy>=1.15",
    "scipy-stubs>=1.15",
    "scikit-learn>=1.5",
    "quantile-forest>=1.4",
]
docs = [
    "quartodoc>=0.11",
    # quartodoc 0.11.1 passes options that griffe 2.x removed (allow_section_blank_line).
    "griffe>=1.5,<2",
    "jupyter>=1.1",
    "ipykernel>=6.29",
    "nbclient>=0.10",
    "nbformat>=5.10",
    "matplotlib>=3.9",
    "pyarrow>=18",
]
experiments = [
    "matplotlib>=3.9",
    "scikit-learn>=1.5",
    "quantile-forest>=1.4",
    "pyarrow>=18",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs/_site", "docs/reference", "report/_freeze", "docs/_freeze"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "NPY", "RUF", "C4", "PT", "N"]
ignore = [
    "N803", # argument names such as `X` or `B` mirror the paper's notation
    "N806", # variable names such as `B` or `K` mirror the paper's notation
    "RUF002", # docstrings use mathematical symbols (σ, ρ, γ)
    "RUF003",
    "RUF001",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["rasterio.*", "rioxarray.*", "shapely.*", "quantile_forest.*", "sklearn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = ["-ra", "--strict-markers", "--doctest-modules", "-m", "not slow"]
markers = [
    "slow: statistical tests with many realizations (deselected by default; run with -m slow)",
    "r_parity: compares against the exported reference outputs of the authors' R script",
    "requires_r: needs a working Rscript with the reference R packages",
]
filterwarnings = ["error::RuntimeWarning:pyspatialuncertainty.*"]
