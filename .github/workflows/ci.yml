name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: uv sync --locked --group dev --all-extras
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Tests (fast suite + R parity on committed reference data)
        run: uv run pytest

  docs:
    name: docs site
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.10.19
      - name: Install
        run: |
          uv sync --locked --group dev --group docs --all-extras
          uv run python -m ipykernel install --user --name python3
      - name: Build API reference and site
        working-directory: docs
        env:
          QUARTO_PYTHON: ${{ github.workspace }}/.venv/bin/python
        run: |
          uv run quartodoc build
          uv run quarto render
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_site

  deploy-docs:
    name: deploy docs to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: docs
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
